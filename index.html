<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ============================================================
       MODEL — Change this title to your own name
       ============================================================ -->
  <title>Your Name | Freelancer Portfolio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <!-- ============================================================
       VIEW — Global Styles & CSS Variables
       ============================================================ -->
  <style>
    /* === CSS Variables (Theme) === */
    :root {
      --bg-primary:    #060d1f;
      --bg-secondary:  #0b1530;
      --bg-card:       #0f1d3a;
      --bg-card-hover: #132245;
      --border:        #1e3358;
      --accent:        #4a9eff;
      --accent-dim:    rgba(74, 158, 255, 0.15);
      --accent-glow:   rgba(74, 158, 255, 0.25);
      --teal:          #5eead4;
      --text-primary:  #e4eaf8;
      --text-secondary:#8fa3c8;
      --text-muted:    #4a6080;
      --font-heading:  'Syne', sans-serif;
      --font-body:     'IBM Plex Sans', sans-serif;
      --radius:        12px;
      --radius-lg:     20px;
      --transition:    0.3s ease;
      --shadow:        0 4px 24px rgba(0, 0, 0, 0.4);
      --shadow-accent: 0 4px 24px rgba(74, 158, 255, 0.15);
    }

    /* === Reset & Base === */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.7;
      overflow-x: hidden;
    }
    a { color: var(--accent); text-decoration: none; transition: color var(--transition); }
    a:hover { color: var(--teal); }
    img { max-width: 100%; display: block; }
    ul { list-style: none; }

    /* === Utility === */
    .container { max-width: 1100px; margin: 0 auto; padding: 0 2rem; }
    .section { padding: 100px 0; }
    .section-label {
      font-family: var(--font-body);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.75rem;
    }
    .section-title {
      font-family: var(--font-heading);
      font-size: clamp(2rem, 4vw, 2.8rem);
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1.2;
      margin-bottom: 1.5rem;
    }
    .section-subtitle {
      color: var(--text-secondary);
      font-size: 1.05rem;
      max-width: 560px;
      margin-bottom: 3.5rem;
    }
    .divider {
      width: 48px;
      height: 3px;
      background: var(--accent);
      border-radius: 2px;
      margin-bottom: 2.5rem;
    }

    /* === Scrollbar === */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-primary); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* ============================================================
       VIEW — Navigation
       ============================================================ */
    #navbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 1000;
      padding: 1.1rem 0;
      background: transparent;
      transition: background var(--transition), border-bottom var(--transition), backdrop-filter var(--transition);
    }
    #navbar.scrolled {
      background: rgba(6, 13, 31, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .nav-logo {
      font-family: var(--font-heading);
      font-weight: 800;
      font-size: 1.25rem;
      color: var(--text-primary);
      letter-spacing: -0.02em;
    }
    .nav-logo span { color: var(--accent); }
    .nav-links {
      display: flex;
      gap: 2rem;
      align-items: center;
    }
    .nav-links a {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-secondary);
      letter-spacing: 0.02em;
      transition: color var(--transition);
      position: relative;
    }
    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: -3px; left: 0;
      width: 0; height: 2px;
      background: var(--accent);
      border-radius: 2px;
      transition: width var(--transition);
    }
    .nav-links a:hover,
    .nav-links a.active { color: var(--text-primary); }
    .nav-links a:hover::after,
    .nav-links a.active::after { width: 100%; }
    .nav-cta {
      background: var(--accent-dim);
      color: var(--accent) !important;
      border: 1px solid var(--border);
      padding: 0.45rem 1.1rem;
      border-radius: 6px;
      transition: background var(--transition), border-color var(--transition) !important;
    }
    .nav-cta:hover {
      background: rgba(74, 158, 255, 0.25) !important;
      border-color: var(--accent) !important;
    }
    .nav-cta::after { display: none !important; }

    /* Hamburger */
    .hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      background: none;
      border: none;
      padding: 4px;
    }
    .hamburger span {
      display: block;
      width: 24px; height: 2px;
      background: var(--text-primary);
      border-radius: 2px;
      transition: transform var(--transition), opacity var(--transition);
    }
    .hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .hamburger.open span:nth-child(2) { opacity: 0; }
    .hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    /* Mobile menu */
    .mobile-menu {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--bg-primary);
      z-index: 999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
    }
    .mobile-menu.open { display: flex; }
    .mobile-menu a {
      font-family: var(--font-heading);
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text-secondary);
      transition: color var(--transition);
    }
    .mobile-menu a:hover { color: var(--accent); }

    /* ============================================================
       VIEW — Hero Section
       ============================================================ */
    #home {
      min-height: 100vh;
      display: flex;
      align-items: center;
      position: relative;
      padding-top: 80px;
      background: var(--bg-primary);
      overflow: hidden;
    }
    /* Subtle grid overlay */
    #home::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(74,158,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(74,158,255,0.04) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
    }
    /* Glow blob */
    #home::after {
      content: '';
      position: absolute;
      top: 10%; left: 55%;
      width: 480px; height: 480px;
      background: radial-gradient(circle, rgba(74,158,255,0.08) 0%, transparent 70%);
      pointer-events: none;
      border-radius: 50%;
    }
    .hero-content { position: relative; z-index: 1; max-width: 720px; }
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--accent-dim);
      border: 1px solid var(--border);
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.4rem 1rem;
      border-radius: 100px;
      margin-bottom: 2rem;
      animation: fadeInUp 0.6s ease both;
    }
    .hero-badge::before {
      content: '';
      width: 7px; height: 7px;
      background: var(--accent);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }
    .hero-name {
      font-family: var(--font-heading);
      font-size: clamp(3rem, 8vw, 5.5rem);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.03em;
      color: var(--text-primary);
      margin-bottom: 0.5rem;
      animation: fadeInUp 0.6s 0.1s ease both;
    }
    .hero-name span { color: var(--accent); }
    .hero-title {
      font-family: var(--font-heading);
      font-size: clamp(1.2rem, 3vw, 1.7rem);
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 1.5rem;
      animation: fadeInUp 0.6s 0.2s ease both;
    }
    .hero-intro {
      font-size: 1.05rem;
      color: var(--text-secondary);
      max-width: 520px;
      line-height: 1.8;
      margin-bottom: 2.5rem;
      animation: fadeInUp 0.6s 0.3s ease both;
    }
    .hero-actions {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      animation: fadeInUp 0.6s 0.4s ease both;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.75rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all var(--transition);
      cursor: pointer;
      border: none;
      font-family: var(--font-body);
    }
    .btn-primary {
      background: var(--accent);
      color: #06101f;
      box-shadow: var(--shadow-accent);
    }
    .btn-primary:hover {
      background: #6ab3ff;
      color: #06101f;
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(74,158,255,0.3);
    }
    .btn-outline {
      background: transparent;
      color: var(--text-primary);
      border: 1px solid var(--border);
    }
    .btn-outline:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-dim);
      transform: translateY(-2px);
    }
    .hero-scroll {
      position: absolute;
      bottom: 2rem; left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      color: var(--text-muted);
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      animation: fadeIn 1s 1s ease both;
    }
    .scroll-line {
      width: 1px; height: 40px;
      background: linear-gradient(to bottom, var(--accent), transparent);
      animation: scrollAnim 2s infinite;
    }
    @keyframes scrollAnim {
      0%   { opacity: 0; transform: scaleY(0); transform-origin: top; }
      50%  { opacity: 1; transform: scaleY(1); }
      100% { opacity: 0; transform: scaleY(1); }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* ============================================================
       VIEW — About Section
       ============================================================ */
    #about { background: var(--bg-secondary); }
    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1.6fr;
      gap: 5rem;
      align-items: center;
    }
    .about-photo-wrap {
      position: relative;
    }
    .about-photo {
      width: 100%;
      aspect-ratio: 4/5;
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      overflow: hidden;
      position: relative;
    }
    .about-photo img {
      width: 100%; height: 100%;
      object-fit: cover;
    }
    /* Placeholder when no photo is provided */
    .about-photo-placeholder {
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      gap: 0.75rem;
      padding: 2rem;
      text-align: center;
    }
    .about-photo-placeholder .icon {
      font-size: 3rem;
      opacity: 0.4;
    }
    .about-photo::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, transparent 60%, rgba(74,158,255,0.08));
      pointer-events: none;
    }
    .about-accent-card {
      position: absolute;
      bottom: -1.5rem; right: -1.5rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
      box-shadow: var(--shadow);
    }
    .accent-card-num {
      font-family: var(--font-heading);
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--accent);
      line-height: 1;
    }
    .accent-card-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
    }
    .about-text p {
      color: var(--text-secondary);
      margin-bottom: 1.25rem;
      font-size: 1rem;
    }
    .about-highlights {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 2rem;
    }
    .highlight-tag {
      background: var(--accent-dim);
      border: 1px solid var(--border);
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 500;
      padding: 0.3rem 0.85rem;
      border-radius: 100px;
    }

    /* ============================================================
       VIEW — Services Section
       ============================================================ */
    #services { background: var(--bg-primary); }
    .services-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
    }
    .service-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 2rem;
      transition: transform var(--transition), border-color var(--transition), box-shadow var(--transition);
      position: relative;
      overflow: hidden;
    }
    .service-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--teal));
      opacity: 0;
      transition: opacity var(--transition);
    }
    .service-card:hover {
      transform: translateY(-5px);
      border-color: rgba(74,158,255,0.3);
      box-shadow: var(--shadow-accent);
    }
    .service-card:hover::before { opacity: 1; }
    .service-icon {
      font-size: 2.2rem;
      margin-bottom: 1.25rem;
      display: block;
    }
    .service-title {
      font-family: var(--font-heading);
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 0.75rem;
    }
    .service-desc {
      color: var(--text-secondary);
      font-size: 0.9rem;
      line-height: 1.7;
    }

    /* ============================================================
       VIEW — Skills Section
       ============================================================ */
    #skills { background: var(--bg-secondary); }
    .skills-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4rem;
      align-items: start;
    }
    .skill-bars { display: flex; flex-direction: column; gap: 1.75rem; }
    .skill-bar-item {}
    .skill-bar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }
    .skill-bar-name {
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--text-primary);
    }
    .skill-bar-pct {
      font-size: 0.8rem;
      color: var(--accent);
      font-weight: 600;
    }
    .skill-bar-track {
      height: 6px;
      background: var(--bg-primary);
      border-radius: 100px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .skill-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--teal));
      border-radius: 100px;
      width: 0;
      transition: width 1.2s ease;
    }
    .skills-tags-wrap {}
    .skills-category { margin-bottom: 2rem; }
    .skills-cat-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
    }
    .skills-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .skill-tag {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 0.82rem;
      font-weight: 500;
      padding: 0.35rem 0.9rem;
      border-radius: 6px;
      transition: all var(--transition);
    }
    .skill-tag:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-dim);
    }

    /* ============================================================
       VIEW — Projects Section
       ============================================================ */
    #projects { background: var(--bg-primary); }
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1.75rem;
    }
    .project-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: transform var(--transition), border-color var(--transition), box-shadow var(--transition);
      display: flex;
      flex-direction: column;
    }
    .project-card:hover {
      transform: translateY(-6px);
      border-color: rgba(74,158,255,0.3);
      box-shadow: 0 16px 48px rgba(0,0,0,0.4), var(--shadow-accent);
    }
    .project-thumb {
      width: 100%;
      aspect-ratio: 16/9;
      background: var(--bg-secondary);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .project-thumb img {
      width: 100%; height: 100%;
      object-fit: cover;
      transition: transform var(--transition);
    }
    .project-card:hover .project-thumb img { transform: scale(1.04); }
    .project-thumb-placeholder {
      color: var(--text-muted);
      font-size: 0.8rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }
    .project-thumb-placeholder .icon { font-size: 2.5rem; opacity: 0.35; }
    .project-type-badge {
      position: absolute;
      top: 0.75rem; left: 0.75rem;
      background: rgba(6,13,31,0.85);
      backdrop-filter: blur(4px);
      border: 1px solid var(--border);
      color: var(--teal);
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0.25rem 0.65rem;
      border-radius: 4px;
    }
    .project-body { padding: 1.5rem; flex: 1; display: flex; flex-direction: column; }
    .project-title {
      font-family: var(--font-heading);
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 0.6rem;
    }
    .project-desc {
      color: var(--text-secondary);
      font-size: 0.88rem;
      line-height: 1.7;
      flex: 1;
      margin-bottom: 1.25rem;
    }
    .project-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 1.25rem;
    }
    .project-tag {
      background: var(--bg-secondary);
      color: var(--text-muted);
      font-size: 0.72rem;
      font-weight: 500;
      padding: 0.2rem 0.65rem;
      border-radius: 4px;
      border: 1px solid var(--border);
    }
    .project-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--accent);
      font-size: 0.875rem;
      font-weight: 600;
      transition: gap var(--transition);
    }
    .project-link:hover { gap: 0.65rem; color: var(--teal); }

    /* ============================================================
       VIEW — Contact Section
       ============================================================ */
    #contact { background: var(--bg-secondary); }
    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1.5fr;
      gap: 5rem;
      align-items: start;
    }
    .contact-info { display: flex; flex-direction: column; gap: 1.5rem; }
    .contact-item {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
    }
    .contact-icon {
      width: 44px; height: 44px;
      background: var(--accent-dim);
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
    }
    .contact-item-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-bottom: 0.2rem;
    }
    .contact-item-value {
      color: var(--text-secondary);
      font-size: 0.95rem;
    }
    .contact-item-value a { color: var(--text-secondary); }
    .contact-item-value a:hover { color: var(--accent); }
    .contact-socials {
      display: flex;
      gap: 0.75rem;
      margin-top: 1rem;
    }
    .social-btn {
      width: 42px; height: 42px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      color: var(--text-secondary);
      transition: all var(--transition);
    }
    .social-btn:hover {
      background: var(--accent-dim);
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-3px);
    }

    /* Contact Form */
    .contact-form { display: flex; flex-direction: column; gap: 1.25rem; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }
    .form-group { display: flex; flex-direction: column; gap: 0.45rem; }
    .form-label {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }
    .form-input,
    .form-textarea {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.8rem 1rem;
      color: var(--text-primary);
      font-family: var(--font-body);

    /* ── Controller: Navbar scroll & active link ─────────────── */
    function initNavbar() {
      const navbar = $("navbar");
      const sections = document.querySelectorAll("section[id]");
      const links = document.querySelectorAll(".nav-links a");

      window.addEventListener("scroll", () => {
        // Sticky style
        if (window.scrollY > 60) navbar.classList.add("scrolled");
        else navbar.classList.remove("scrolled");

        // Active link
        let current = "";
        sections.forEach(sec => {
          if (window.scrollY >= sec.offsetTop - 120) current = sec.id;
        });
        links.forEach(a => {
          a.classList.toggle("active", a.getAttribute("href") === `#${current}`);
        });
      });

      // Hamburger
      $("hamburger").addEventListener("click", () => {
        const open = $("hamburger").classList.toggle("open");
        $("mobileMenu").classList.toggle("open", open);
        document.body.style.overflow = open ? "hidden" : "";
      });
    }

    /* ── Controller: Skill bar animation on scroll ───────────── */
    function initSkillBars() {
      const fills = document.querySelectorAll(".skill-bar-fill");
      const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.style.width = entry.target.dataset.pct + "%";
          }
        });
      }, { threshold: 0.3 });
      fills.forEach(f => observer.observe(f));
    }

    /* ── Controller: Reveal animations on scroll ─────────────── */
    function initReveal() {
      const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add("visible");
          }
        });
      }, { threshold: 0.12 });
      document.querySelectorAll(".reveal").forEach(el => observer.observe(el));
    }

      if (!name || !email || !msg) {
        status.className = "form-status error";
        status.textContent = "Please fill in your name, email, and message.";
        return;
      }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        status.className = "form-status error";
        status.textContent = "Please enter a valid email address.";
        return;
      }
      /* ✏️ To wire this form to a real backend, replace this block
         with a fetch() call to your API or a service like Formspree.
         e.g.: fetch('https://formspree.io/f/YOUR_FORM_ID', { method:'POST', ... })
      */
      status.className = "form-status success";
      status.textContent = `Thanks, ${name}! Your message has been sent. I'll get back to you soon.`;
      [$("cfName"), $("cfEmail"), $("cfSubject"), $("cfMsg")].forEach(el => el.value = "");
    }

    /* ── Controller: Close mobile menu ──────────────────────── */
    function closeMenu() {
      $("hamburger").classList.remove("open");
      $("mobileMenu").classList.remove("open");
      document.body.style.overflow = "";
    }

    /* ── Controller: Init — run everything ──────────────────── */
    const PortfolioController = {
      handleFormSubmit,
      init() {
        renderHero();
        renderAbout();
        renderServices();
        renderSkills();
        renderProjects();
        renderContact();
        renderFooter();
        initNavbar();
        // Wait for DOM updates before observing
        setTimeout(() => {
          initReveal();
          initSkillBars();
        }, 50);
      }
    };

    document.addEventListener("DOMContentLoaded", () => PortfolioController.init());
  </script>
</body>
</html>
